<!--
  Plantilla "Confirm signup" de Supabase Auth.
  Copiar en Dashboard → Authentication → Emails → Confirm signup.
  {{ .Token }} es el código de 6 dígitos que la app pide en "Verifica tu correo".
-->
<table width="100%" cellpadding="0" cellspacing="0" style="background:#F4F7F9;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#FFFFFF;border-radius:16px;padding:32px 28px;">
        <tr>
          <td align="center" style="font-size:24px;font-weight:bold;color:#0D2B45;padding-bottom:8px;">
            Karsy
          </td>
        </tr>
        <tr>
          <td align="center" style="font-size:18px;font-weight:bold;color:#0D2B45;padding-bottom:12px;">
            Verifica tu correo
          </td>
        </tr>
        <tr>
          <td align="center" style="font-size:14px;line-height:21px;color:#667085;padding-bottom:24px;">
            Escribe este código en la app para confirmar tu cuenta:
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <span style="display:inline-block;background:#EBF6F7;border:1.5px solid #52A3AA;border-radius:12px;padding:14px 22px;font-size:30px;font-weight:bold;letter-spacing:8px;color:#0D2B45;">{{ .Token }}</span>
          </td>
        </tr>
        <tr>
          <td align="center" style="font-size:12px;line-height:18px;color:#8E9A8E;">
            El código vence en 1 hora. Si no fuiste tú, ignora este correo.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
